name: Prepack

on:
  push:
  pull_request:

jobs:
  prepack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create package tarball
        run: npm pack --pack-destination .

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
