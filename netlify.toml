[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The bundle is versioned by deploy, so it can be cached hard.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
