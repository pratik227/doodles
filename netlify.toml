[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # tsdown requires ^22.18.0 || >=24.11.0, so Node 20 is too old. Matches the CI workflow.
  NODE_VERSION = "22"

# The bundle is versioned by deploy, so it can be cached hard.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
